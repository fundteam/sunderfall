      }
      #hud {

        flex-wrap: wrap;
        font-size: 14px;
        padding: 4px 2px;
      }
      #hud b {
        color: #e8b84a;
      }
      canvas {
        width: 100%;
        display: block;
        image-rendering: pixelated;
        border: 3px solid #5a4630;
        touch-action: none;
        background: #3c6b34;
      }
      button {
        font: bold 13px monospace;
        background: #4a3a2a;
        color: #f2e9d0;
        border: 2px solid #8a7050;
        box-shadow: inset 0 -3px #2a1f15;
        padding: 6px 10px;
        border-radius: 2px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
      }
      button.go {
        background: #8a2b2b;
        border-color: #d05a5a;
      }
      #panel {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 6px;
        min-height: 42px;
        align-items: center;
        font-size: 13px;
      }
      #ov {
        position: absolute;
        inset: 0;
        background: #14101cee;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        gap: 12px;
      }
      #ov h1 {
        margin: 0;
        color: #e8b84a;
        font-size: 26px;
      }
      #ov p {
        max-width: 520px;
        line-height: 1.5;
        margin: 0;
      }
      #g.fs {
        position: fixed;
        inset: 0;
        max-width: none;
        margin: 0;
        z-index: 9;
        background: #000;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #g.fs canvas {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border: 0;
      }
      #g.fs #hud {
        position: absolute;
        top: calc(4px + env(safe-area-inset-top));
        left: calc(4px + env(safe-area-inset-left));
        z-index: 5;
        background: #000a;
        padding: 2px 4px;
        border-radius: 4px;
        gap: 4px;
      }
      #g.fs button {
        padding: 3px 6px;
        font-size: 11px;
      }
    </style>

            X.save();
            X.translate(x + Math.cos(a) * k, y + Math.sin(a) * k);
            X.rotate(a);
            X.fillRect(-1, -3, 2, 6);
            X.fillRect(1, -2, 2, 4);
            X.restore();
          }
          X.font = "bold 7px monospace";
          txt("ศัตรูเข้า", Math.max(2, x - 15), y - 14, "#ff8080");
        });
        RT.forEach((q) => {
          const p = cl(q.P[q.P.length - 1]),
            key = p.join();
          if (seen.has(key)) return;
          seen.add(key);
          const [x, y] = p;
          X.fillStyle = "#3a80ff33";
          X.beginPath();
          X.arc(x, y, 14 + pu, 0, 7);
          X.fill();
          R(x - 7, y - 9, 14, 16, "#0a1a3a");
          R(x - 6, y - 8, 12, 13, "#3a70e0");
          R(x - 6, y - 8, 12, 2, "#8ab4ff");
          R(x - 3, y + 4, 6, 3, "#3a70e0");
          R(x - 2, y - 4, 4, 6, "#e8b84a");
          R(x - 4, y - 5, 8, 1, "#e8b84a");
          X.font = "bold 7px monospace";
          txt(
            "ปกป้อง!",
            Math.min(W - 34, Math.max(2, x - 14)),
            y + 16,
            "#8ab4ff",
          );
        });
      }
      function drawFX(tm) {
        GP.forEach((p) => {
          X.fillStyle =
            p.k == "g" ? "#a040e044" : p.k == "v" ? "#ff4a1099" : "#ff8a2077";
          X.beginPath();
          X.ellipse(p.x, p.y, p.r, p.r * 0.55, 0, 0, 7);
          X.fill();
        });
        UL.forEach((u) => {
          for (let i = 0; i < 8; i++) {
            const a = tm * 6 + i * 0.785;
            X.fillStyle = "#8fd860";
            X.fillRect(
              u.x + Math.cos(a) * (30 + (i % 2) * 20) - 2,
              u.y + Math.sin(a) * (18 + (i % 2) * 12) - 1,
              5,
              2,
            );
          }
        });
        AL.forEach((a) => {
          X.strokeStyle = a.on ? "#ffd24a" : "#8ab4ff";
          X.lineWidth = 1.5;
          X.beginPath();
          X.arc(a.x, a.y, 10, 0, 7);
          X.stroke();
          X.beginPath();
          X.arc(a.x, a.y, 10, -1.57, -1.57 + Math.min(1, a.p / 3) * 6.28);
          X.stroke();
          R(a.x - 2, a.y - 2, 4, 4, a.on ? "#ffd24a" : "#8ab4ff");
        });
        En.forEach((e) => {
          if (e.bar > 0) {
            X.strokeStyle = "#ffe080";
            X.lineWidth = 1.5;
            X.beginPath();
            X.ellipse(e.x, e.y - 14, 18, 22, 0, 0, 7);
            X.stroke();
          }
        });
      }
      function pan(x, y, w, h) {
        R(x, y, w, h, "#1c140e");
        R(x + 1, y + 1, w - 2, h - 2, "#3b2c1e");
        R(x + 2, y + 2, w - 4, h - 4, "#2a1f15");
        R(x + 1, y + 1, w - 2, 1, "#7a6648");
      }
      function txt(s, x, y, c) {
        X.fillStyle = "#000";
        X.fillText(s, x + 1, y + 1);
        X.fillStyle = c || "#f2e9d0";
        X.fillText(s, x, y);
      }
      function draw() {
        const tm = performance.now() / 1000;
        X.setTransform(2, 0, 0, 2, 0, 0);
        X.imageSmoothingEnabled = false;
        X.drawImage(BG, 0, 0, W, H);
        BT = [];
        DC.forEach((d) => {
          X.fillStyle = "#6b1a1a99";
          X.beginPath();
          X.ellipse(d[0], d[1], 7, 3, 0, 0, 7);
          X.fill();
          X.save();
          X.translate(d[0], d[1]);
          X.rotate(d[3] * 1.57);
          const c = gs(d[2], 0),
            w = c.width / 2,
            h = c.height / 2;
          X.globalAlpha = 0.8;
          X.drawImage(c, -w / 2, -h / 2, w, h);
          X.restore();
        });
        LV.th.fire.forEach(([x0, y, pu]) => {
          const x = x0 + DX,
            fh = 4 + Math.sin(tm * 18 + x) * 2;
          R(x - 3, y - fh, 7, fh + 3, pu ? "#9a40ff" : "#ff7a1a");
          R(x - 1, y - fh / 2, 3, fh / 2 + 2, pu ? "#e0b0ff" : "#ffd24a");
          X.fillStyle = pu ? "#b060ff22" : "#ff8a2a22";
          X.beginPath();
          X.arc(x, y, 14 + Math.sin(tm * 9) * 2, 0, 7);
          X.fill();
        });
        SP.forEach((s, i) => {
          if (tw[i]) return;
          R(s[0] - 12, s[1] - 3, 24, 9, "#5a4128");
          R(s[0] - 11, s[1] - 5, 22, 9, "#9c7a4c");
          R(s[0] - 8, s[1] - 4, 16, 6, "#7e6038");
          R(s[0] - 6, s[1] - 4, 4, 1, "#b99660");
          if (i === sel) {
            X.strokeStyle = "#e8b84a";
            X.lineWidth = 1;
            X.strokeRect(s[0] - 12.5, s[1] - 5.5, 25, 14);
          }
        });
        if (sel != null && tw[sel] && !T[tw[sel].k].br) {
          const t = tw[sel];
          X.strokeStyle = "#fff6";
          X.lineWidth = 1;
          X.beginPath();
          X.arc(t.x, t.y, tv(t).r, 0, 7);
          X.stroke();
        }
        LA.forEach((p) => {
          X.fillStyle = p.k == "d" ? "#ff6a10aa" : "#ff9a2088";
          X.beginPath();
          X.ellipse(p.x, p.y, 6, 3.5, 0, 0, 7);
          X.fill();
          X.fillStyle = "#ffe08a88";
          X.fillRect(p.x - 2, p.y - 1, 3, 1);
        });
        marks(tm);
        drawFX(tm);
        const O = [];
        tw.forEach(
          (t) =>
            t &&
            O.push([
              t.y + 10,
              () => {
                const c = gs(t.k, 0, t.tier, t.v);
                shd(t.x, t.y + 9, c.width / 4);
                spr(c, t.x, t.y + 10, 1);
                if (t.k == "mage") {
                  X.fillStyle =
                    "rgba(110,200,255," +
                    (0.25 + 0.15 * Math.sin(tm * 6)) +
                    ")";
                  X.beginPath();
                  X.arc(t.x, t.y - 28, 4 + Math.sin(tm * 6), 0, 7);
                  X.fill();
                }
                for (let i = 0; i <= t.tier; i++)
                  R(t.x - 8 + i * 5, t.y + 12, 3, 2, "#e8b84a");
                if (t.stun > 0 || t.sx > performance.now()) {
                  X.font = "10px sans-serif";
                  X.fillText(
                    t.sx > performance.now() ? "🤫" : "💫",
                    t.x - 6,
                    t.y - 36,
                  );
                }
              },
            ]),
        );
        F.forEach((f) => !f.dead && O.push([f.y, () => SD(f, tm)]));
        DY = DY.filter((d) => {
          const a = (performance.now() - d.t0) / 1000;
          if (a > 0.55) {
            if (d.dc) {
              DC.push([d.x, d.y - 2, d.n, -d.fl]);
              if (DC.length > 70) DC.shift();
            }
            return false;
          }
          O.push([
            d.y,
            () => {
              const k = Math.min(1, a / 0.4),
                c = gs(d.n, 0);
              shd(d.x, d.y, c.width / 4);
              spr(
                c,
                d.x - d.fl * k * 3,
                d.y,
                d.fl,
                d.dc ? 1 : 1 - Math.max(0, (a - 0.4) / 0.15),
                -k * 1.5,
              );
              if (a < 0.1) spr(whc(c), d.x, d.y, d.fl, 0.7, 0);
            },
          ]);
          return true;
        });
        En.forEach((e) => O.push([e.y, () => EN(e, tm)]));
        BN.forEach((n) =>
          O.push([
            n.y,
            () => {
              X.fillStyle = "#e8b84a18";
              X.beginPath();
              X.arc(n.x, n.y, 70, 0, 7);
              X.fill();
              R(n.x - 1, n.y - 22, 2, 22, "#4a3a2a");
              R(n.x + 1, n.y - 22, 12 + Math.sin(tm * 6), 8, "#c43030");
              R(n.x + 3, n.y - 19, 5, 3, "#e8b84a");
            },
          ]),
        );
        O.sort((a, b) => a[0] - b[0]).forEach((o) => o[1]());
        Pr.forEach((p) => {
          if (p.ox != null) {
            X.strokeStyle = p.lc || "#bff";
            X.lineWidth = 1;
            X.beginPath();
            X.moveTo(p.ox, p.oy);
            for (let i = 1; i < 4; i++)
              X.lineTo(
                p.ox + ((p.x - p.ox) * i) / 4 + Math.random() * 6 - 3,
                p.oy + ((p.y - p.oy) * i) / 4 + Math.random() * 6 - 3,
              );
            X.lineTo(p.x, p.y);
            X.stroke();
            X.fillStyle = "#6cf";
            X.fillRect(p.x - 2, p.y - 2, 4, 4);
            X.fillStyle = "#fff";
            X.fillRect(p.x - 1, p.y - 1, 2, 2);
          } else if (p.sx) {
            X.fillStyle = "#222";
            X.beginPath();
            X.arc(p.x, p.y, 2.5, 0, 7);
            X.fill();
            X.fillStyle = "#777";
            X.fillRect(p.x - 1.5, p.y - 1.5, 1, 1);
          } else {
            const a = Math.atan2((p.ty2 ?? p.y) - p.y, (p.tx ?? p.x) - p.x);
            X.save();
            X.translate(p.x, p.y);
            X.rotate(a);
            X.fillStyle = "#a06a3a";
            X.fillRect(-5, -0.5, 8, 1);
            X.fillStyle = "#eee";
            X.fillRect(3, -1, 2, 2);
            X.fillStyle = "#e8e8e8";
            X.fillRect(-6, -1, 2, 2);
            X.restore();
          }
        });
        X.font = "10px sans-serif";
        fx.forEach((f) => {
          if (f.s == "ln") {
            X.strokeStyle = "#ffe080";
            X.lineWidth = 1.5;
            X.beginPath();
            X.moveTo(f.x, f.y);
            X.lineTo(f.x2, f.y2);
            X.stroke();
            X.fillStyle = "#fff";
            X.fillRect(f.x2 - 1, f.y2 - 1, 2, 2);
          } else if (f.s == "o") {
            const k = Math.max(0, 1 - f.t / 0.3);
            X.fillStyle = "#ffa04088";
            X.beginPath();
            X.arc(f.x, f.y, 34 * k, 0, 7);
            X.fill();
            X.fillStyle = "#ffe08a99";
            X.beginPath();
            X.arc(f.x, f.y, 20 * k, 0, 7);
            X.fill();
          } else {
            X.fillStyle = "#fff";
            X.fillText(f.s, f.x - 6, f.y - (1 - f.t) * 10);
          }
        });
        X.font = "bold 9px monospace";
        if (sel != null && tw[sel]) {
          const t = tw[sel],
            cx = t.x,
            cy = Math.max(14, t.y - 46);
          if (t.tier < 2) {
            const c = T[t.k].c[t.tier + 1],
              ok = S.gold >= c;
            pan(cx - 27, cy - 9, 18, 18);
            R(cx - 22, cy - 4, 8, 3, ok ? "#6fd05a" : "#777");
            R(cx - 20, cy - 6, 4, 8, ok ? "#6fd05a" : "#777");
            txt(c, cx - 27, cy + 19, ok ? "#e8b84a" : "#999");
            BT.push({
              x: cx - 27,
              y: cy - 9,
              w: 18,
              h: 18,
              f: () => ok && upg(sel),
            });
          } else if (t.tier == 2)
            ["A", "B"].forEach((v, j) => {
              const o = V4[t.k + v],
                ok = S.gold >= o.c,
                bx = cx - 47 + j * 20,
                cl = v == "A" ? "#ffd24a" : "#c060ff";
              pan(bx, cy - 9, 18, 18);
              txt(v, bx + 6, cy + 4, cl);
              txt(o.c, bx, cy + 19, ok ? "#e8b84a" : "#999");
              BT.push({
                x: bx,
                y: cy - 9,
                w: 18,
                h: 18,
                f: () => ok && upg(sel, v),
              });
              X.font = "bold 8px monospace";
              txt(v + ":" + o.n, cx - 47, cy + 28 + j * 9, cl);
              X.font = "bold 9px monospace";
            });
          pan(cx + 9, cy - 9, 18, 18);
          txt("$", cx + 14, cy + 4, "#e8b84a");
          BT.push({ x: cx + 9, y: cy - 9, w: 18, h: 18, f: () => sell(sel) });
        }
        if (auto && !S.run && !ended && S.wave < WV.length) {
          X.font = "bold 11px monospace";
          txt(
            "Wave " + (S.wave + 1) + " เริ่มใน " + Math.ceil(S.nx) + " วิ",
            W / 2 - 50,
            16,
            "#e8b84a",
          );
        }
        X.font = "bold 11px monospace";
        pan(4, 294, 52, 22);
        R(11, 300, 9, 9, "#8a6a1a");
        R(12, 301, 7, 7, "#e8b84a");
        R(14, 303, 2, 3, "#fff0a0");
        txt(Math.floor(S.gold), 24, 309);
        pan(60, 294, 42, 22);
        const hx = 67,
          hy = 300,
          hc = "#e33";
        R(hx + 1, hy, 3, 2, hc);
        R(hx + 5, hy, 3, 2, hc);
        R(hx, hy + 1, 9, 3, hc);
        R(hx + 1, hy + 4, 7, 1, hc);
        R(hx + 3, hy + 5, 3, 1, hc);
        txt(Math.max(0, S.lives), 80, 309);
        pan(106, 294, 50, 22);
        R(112, 300, 8, 6, "#cfcfcf");
        R(113, 302, 2, 2, "#222");
        R(117, 302, 2, 2, "#222");
        R(114, 306, 4, 2, "#cfcfcf");
        txt(S.wave + "/" + WV.length, 124, 309);
        const act = sel != null && !tw[sel];
        dk().forEach((k, i) => {
          const bx = W - 140 + (i % 4) * 34,
            by = 284 - ((i / 4) | 0) * 36,
            ok = act && S.gold >= T[k].c[0];
          pan(bx, by, 32, 34);
          X.save();
          X.beginPath();
          X.rect(bx + 2, by + 2, 28, 30);
          X.clip();
          const c = gs(k, 0, 0),
            sc = Math.min(26 / (c.width / 2), 26 / (c.height / 2));
          X.drawImage(
            c,
            bx + 16 - (c.width / 4) * sc,
            by + 31 - (c.height / 2) * sc,
            (c.width / 2) * sc,
            (c.height / 2) * sc,
          );
          X.restore();
          txt(T[k].c[0], bx + 3, by + 11, ok ? "#e8b84a" : "#bbb");
          if (!ok) {
            R(bx + 2, by + 2, 28, 30, "#000a");
          } else {
            BT.push({
              x: bx,
              y: by,
              w: 32,
              h: 34,
              f: () => {
                build(sel, k);
                sel = null;
              },
            });
          }
        });
      }
      let last = 0;
      function loop(ts) {
        const dt = Math.min(0.05, (ts - last) / 1000 || 0);
        last = ts;
        if (!ended && $("ov").style.display == "none")
          for (let i = 0; i < spd; i++) step(dt);
        draw();
        requestAnimationFrame(loop);
      }
      C.addEventListener("pointerdown", (ev) => {
        const r = C.getBoundingClientRect(),
          k = Math.min(r.width / W, r.height / H),
          x = (ev.clientX - r.left - (r.width - W * k) / 2) / k,
          y = (ev.clientY - r.top - (r.height - H * k) / 2) / k;
        for (const b of BT)
          if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
            b.f();
            ui();
            return;
          }
        const i = SP.findIndex((s) => Math.hypot(s[0] - x, s[1] - y) < 18);
        if (i >= 0) sel = i;
        else {
          if (!hero.dead) {
            hero.rx = Math.max(8, Math.min(W - 8, x));
            hero.ry = Math.max(8, Math.min(H - 8, y));
          }
          sel = null;
        }
        ui();
      });
      let auto = true;
      $("au").onclick = () => {
        auto = !auto;
        S.nx = S.wave ? 5 : 10;
        $("au").textContent = "Auto: " + (auto ? "ON" : "OFF");
      };
      $("sw").onclick = startWave;
      $("sp").onclick = () => {
        spd = spd == 1 ? 2 : 1;
        $("sp").textContent = "x" + spd;
      };
      function useSkill() {
        if (S.cd > 0 || hero.dead) return;
        if (HK == "elron")
          En.forEach((e) => {
            if (!e.dead && dist(e, hero) < 90) e.stun = E[e.k].bs ? 1.5 : 3;
          });
        else if (HK == "malax") {
          let b = null,
            bd = 140;
          En.forEach((e) => {
            if (!e.dead) {
              const d = dist(e, hero);
              if (d < bd) {
                bd = d;
                b = e;
              }
            }
          });
          const a = b
            ? Math.atan2(b.y - hero.y, b.x - hero.x)
            : (hero.fl || 1) > 0
              ? 0
              : Math.PI;
          En.forEach((e) => {
            if (e.dead) return;
            const dx = e.x - hero.x,
              dy = e.y - hero.y,
              al = dx * Math.cos(a) + dy * Math.sin(a),
              pd = Math.abs(-dx * Math.sin(a) + dy * Math.cos(a));
            if (al > 0 && al < 130 && pd < 14) hurt(e, 130, "m", 0, "f");
          });
          for (let i = 1; i <= 6; i++)
            fx.push({
              x: hero.x + Math.cos(a) * i * 20,
              y: hero.y + Math.sin(a) * i * 20,
              t: 0.35,
              s: "o",
            });
        } else
          F.forEach((f) => {
            if (!f.dead && dist(f, hero) < 110) f.shield = 4;
          });
        S.cd = HK == "malax" ? 18 : 20;
        ui();
      }
      function useUlt() {
        if (S.cu > 0 || hero.dead) return;
        if (HK == "leo" && LV.ch >= 4) hero.aw = 8;
        else if (HK == "elron") UL.push({ x: hero.x, y: hero.y, t: 6 });
        else if (HK == "malax") {
          En.forEach((e) => {
            if (e.dead) return;
            const b = E[e.k];
            if (!b.bs && b.hp <= 300) hurt(e, 1e9, "t", 0, "f");
            else hurt(e, 250, "m", 0, "f");
          });
          fx.push({ x: W / 2, y: H / 2, t: 0.8, s: "☄️" });
        } else return;
        S.cu = 60;
        ui();
      }
      $("sk").onclick = useSkill;
      $("ul").onclick = useUlt;

      $("fs").onclick = () => {
        const g = $("g");
        if (!g.classList.contains("fs")) {
          g.classList.add("fs");
          g.requestFullscreen &&
            g
              .requestFullscreen()
              .then(() => {
                try {
                  screen.orientation.lock("landscape").catch(() => {});
                } catch (e) {}
              })
              .catch(() => {});
        } else {
          g.classList.remove("fs");
          document.fullscreenElement && document.exitFullscreen();
        }
      };
      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement) $("g").classList.remove("fs");
      });
      loadHF();
      ld();
      go(UN);
      requestAnimationFrame(loop);
      setInterval(() => {
        if (S.cd > 0) ui();
      }, 500);
    </script>
  </body>
